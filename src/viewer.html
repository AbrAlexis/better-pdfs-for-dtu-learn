<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DTU PDF Search</title>
  <link rel="stylesheet" href="vendor/web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <header id="toolbar" aria-label="PDF controls">
    <button id="findToggle" type="button" aria-label="Find in PDF" title="Search all pages (Ctrl+F / ⌘F)" aria-expanded="false" aria-controls="findbar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    <div class="controls page-controls">
      <button id="previousPage" type="button" aria-label="Previous page" disabled>←</button>
      <input id="pageNumber" type="number" min="1" value="1" aria-label="Page number" disabled>
      <span id="pageCount">/ —</span>
      <button id="nextPage" type="button" aria-label="Next page" disabled>→</button>
    </div>
    <div class="controls zoom-controls">
      <button id="zoomOut" type="button" aria-label="Zoom out" disabled>−</button>
      <select id="scale" aria-label="Zoom" disabled>
        <option value="page-width">Fit width</option>
        <option value="page-fit">Fit page</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="custom" hidden>Custom</option>
      </select>
      <button id="zoomIn" type="button" aria-label="Zoom in" disabled>+</button>
    </div>
    <div id="findbar" class="controls" hidden>
        <input id="query" type="search" placeholder="Search all pages…" aria-label="Search all pages" autocomplete="off" spellcheck="false">
        <span id="findStatus" role="status" aria-live="polite"></span>
        <button id="findPrevious" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
        <button id="findNext" type="button" title="Next match (Enter)" aria-label="Next match">↓</button>
        <label class="search-option" title="Match case"><input id="matchCase" type="checkbox" aria-label="Match case"><span aria-hidden="true">Aa</span></label>
        <label class="search-option" title="Whole words"><input id="wholeWord" type="checkbox" aria-label="Whole words"><span aria-hidden="true">W</span></label>
        <button id="findClose" type="button" aria-label="Close search">×</button>
    </div>
    <details id="optionsMenu" class="menu">
      <summary aria-label="PDF options" title="PDF options">⋯</summary>
      <div class="menu-items">
        <a id="openOriginal" target="_blank" rel="noopener noreferrer" aria-disabled="true">Open PDF in new tab</a>
        <button id="useOriginal" type="button">Use original viewer</button>
      </div>
    </details>
  </header>
  <main id="documentArea">
    <div id="viewerContainer" tabindex="0" aria-label="PDF pages" aria-busy="true">
      <div id="viewer" class="pdfViewer"></div>
    </div>
    <p id="loading" role="status">Loading PDF…</p>
  </main>
</body>
</html>
